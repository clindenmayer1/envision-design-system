name: CI

# The Envision design-system quality pipeline. Every job below runs on every PR and on pushes to
# main. Jobs marked "blocking" gate merge/release; the app job is advisory (pre-existing debt).
# See QUALITY-STRATEGY.md for the layer-by-layer rationale and the block/advisory policy.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Layer 1: static analysis (fast, fail-first) ─────────────────────────────
  lint-typecheck:
    name: Lint + typecheck — blocking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Lint (packages/*)
        run: npx eslint packages --no-error-on-unmatched-pattern
      - name: Typecheck — components
        run: npm run typecheck -w @envision/components
      - name: Typecheck — react adapter
        run: npm run typecheck -w @envision/react

  # ── Layer 2: token validation ───────────────────────────────────────────────
  tokens:
    name: Token validation — blocking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Build tokens (Figma snapshot → DTCG → CSS + TS)
        run: npm run tokens
      - name: Token drift check (committed dist must match source)
        run: git diff --exit-code -- packages/tokens/dist
      - name: Token tests (validation + generated-CSS integration)
        run: npm run test:tokens

  # ── Layer 3: unit / contract behaviour (incl. fast axe a11y) ─────────────────
  unit:
    name: Unit + contract tests — blocking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Build components + dist drift check
        run: npm run build -w @envision/components && git diff --exit-code -- packages/components/dist
      - name: Component tests (contract · ARIA · keyboard · axe unit a11y)
        run: npm run test -w @envision/components
      - name: Build React adapter + dist drift check
        run: npm run build -w @envision/react && git diff --exit-code -- packages/react/dist
      - name: React adapter typecheck + tests
        run: npm run verify -w @envision/react

  # ── Layer 4: Storybook / documentation build ────────────────────────────────
  storybook-build:
    name: Storybook + docs build — blocking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Build components (Storybook consumes the real dist)
        run: npm run build -w @envision/components
      - name: Build Storybook (also compiles all MDX docs)
        run: npm run build -w @envision/storybook
      - uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: packages/storybook/storybook-static
          retention-days: 3

  # ── Layer 5: interaction + accessibility (browser) ───────────────────────────
  interaction-a11y:
    name: Interaction + a11y (test-runner) — blocking
    runs-on: ubuntu-latest
    needs: storybook-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with: { name: storybook-static, path: packages/storybook/storybook-static }
      - name: Play functions + axe WCAG 2.2 AA (every story)
        run: npm run test:stories:ci -w @envision/storybook

  # ── Layer 6: visual regression (browser) ─────────────────────────────────────
  visual-regression:
    name: Visual regression — blocking (approval workflow)
    runs-on: ubuntu-latest
    needs: storybook-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with: { name: storybook-static, path: packages/storybook/storybook-static }
      - name: Compare stories to committed baselines
        run: npm run visual -w @envision/storybook
      - name: Upload diff report on failure (review, then approve if intentional)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff-report
          path: packages/storybook/playwright-report
          retention-days: 7

  # ── Advisory: the Envision app (pre-existing type/lint debt) ─────────────────
  app:
    name: Envision app — advisory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
        continue-on-error: true
      - name: Lint app
        run: npx eslint src --no-error-on-unmatched-pattern
        continue-on-error: true
      - name: Build app
        run: npm run build
        continue-on-error: true
